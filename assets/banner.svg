<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.4; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
    .flow-line { stroke-dasharray: 8 8; animation: dash 25s linear infinite; }
    .badge-pill { rx: 14; ry: 14; fill: #1e293b; fill-opacity: 0.7; stroke: #334155; stroke-width: 1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g filter="url(#softGlow)" class="pulse-circle">
    <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.12" />
    <circle cx="1000" cy="280" r="160" fill="#c084fc" opacity="0.12" />
    <circle cx="600" cy="200" r="180" fill="#818cf8" opacity="0.08" />
  </g>

  <!-- Animated Flow Pipelines (Scheduling Network Streams) -->
  <g filter="url(#glow)">
    <path class="flow-line" d="M -50 100 Q 300 40 600 130 T 1250 80" fill="none" stroke="url(#wireGrad)" stroke-width="2.5" />
    <path class="flow-line" d="M -50 320 Q 350 380 650 280 T 1250 310" fill="none" stroke="url(#wireGrad)" stroke-width="2" />
    <path class="flow-line" d="M 100 450 Q 500 220 1150 380" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Geometric Circuit Traces and Nodes (Always behind foreground text) -->
  <g opacity="0.4">
    <circle cx="180" cy="100" r="5" fill="#38bdf8" />
    <circle cx="340" cy="70" r="4" fill="#818cf8" />
    <circle cx="880" cy="110" r="5" fill="#c084fc" />
    <circle cx="1020" cy="90" r="4" fill="#38bdf8" />
    <circle cx="240" cy="310" r="4" fill="#818cf8" />
    <circle cx="950" cy="330" r="5" fill="#38bdf8" />
  </g>

  <!-- Interactive Decorative Feature Pills (Top & Bottom) -->
  <g transform="translate(340, 45)">
    <rect x="0" y="0" width="130" height="28" class="badge-pill" />
    <text x="65" y="19" text-anchor="middle" class="badge-text">⚡ Real-Time</text>
    
    <rect x="145" y="0" width="145" height="28" class="badge-pill" />
    <text x="217" y="19" text-anchor="middle" class="badge-text">🔄 DAG Workflows</text>
    
    <rect x="305" y="0" width="140" height="28" class="badge-pill" />
    <text x="375" y="19" text-anchor="middle" class="badge-text">☁️ Event Bridges</text>
    
    <rect x="460" y="0" width="125" height="28" class="badge-pill" />
    <text x="522" y="19" text-anchor="middle" class="badge-text">⏱️ Cron Jobs</text>
  </g>

  <!-- Foreground Text: Header & Titles (Guaranteed 100% Legibility & Foreground Position) -->
  <g id="foreground-content">
    <!-- Icon/Badge Mark -->
    <g transform="translate(600, 135)">
      <circle cx="0" cy="0" r="26" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)" />
      <!-- Clock & Node Icon -->
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="0" x2="0" y2="-7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="0" x2="6" y2="4" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">
      Automated Job &amp; Event Scheduling
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2px">
      Curated Workload Automation, Cloud Event Buses, Distributed Schedulers &amp; DAG Orchestrators
    </text>

    <!-- Bottom Feature Tagline -->
    <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="1.5px">
      ENTERPRISE WLA • SERVERLESS EVENTS • DISTRIBUTED CRON • DAG ENGINES
    </text>
  </g>
</svg>
